<GridLayout #pad class="pad" (touch)="onTouch($any($event))">
  <Label text="Sign here" class="pad-placeholder" verticalAlignment="center" [visibility]="empty ? 'visible' : 'collapse'"></Label>
  <GridLayout rows="auto" columns="auto, *" verticalAlignment="bottom" class="pad-baseline-row">
    <Label col="0" text="✕" class="pad-x"></Label>
    <GridLayout col="1" height="1.5" class="pad-baseline" verticalAlignment="center"></GridLayout>
  </GridLayout>
  <!-- an older saved signature that has no strokes: shown as a picture until the user draws -->
  <Image #saved stretch="aspectFit" visibility="collapse" isUserInteractionEnabled="false" class="pad-saved"></Image>
  <Image #ink stretch="fill" isUserInteractionEnabled="false"></Image>
</GridLayout>

<ActionBar title="My signature" class="action-bar">
  <NavigationButton text="Back" icon="res://ic_arrow_back" (tap)="goBack()"></NavigationButton>
</ActionBar>

<GridLayout rows="auto, *, auto, auto" class="page-bg">
  <StackLayout row="0" class="px-5 pt-4 pb-3">
    <Label text="Draw your signature" class="screen-title"></Label>
    <Label text="Use your finger. It's saved on this device and reused for every document." class="screen-sub"
      textWrap="true"></Label>
  </StackLayout>

  <!-- Drawing surface -->
  <GridLayout row="1" class="pad-shell">
    <app-signature-pad #pad [color]="color()" [lineWidth]="thickness()"
      (changed)="hasInk.set($event)"></app-signature-pad>
  </GridLayout>

  <!-- Ink controls -->3
  <StackLayout row="2" class="tool-card">
    <GridLayout rows="auto" columns="*, auto">
      <Label col="0" text="INK COLOUR" class="tool-caption"></Label>
      <Label col="1" [text]="colorName()" class="tool-value" [color]="color()"></Label>
    </GridLayout>
    <!-- all colours visible at once: 10 per row -->
    <WrapLayout orientation="horizontal" class="mt-2" [itemWidth]="swatchCell" [itemHeight]="swatchCell">
      @for (c of colors; track c.value) {
      <GridLayout class="swatch-ring" [class.swatch-ring-active]="color() === c.value"
        [borderColor]="color() === c.value ? c.value : 'transparent'" (tap)="setColor(c.value)">
        <GridLayout class="swatch" [backgroundColor]="c.value">
          @if (color() === c.value) {
          <Label text="✓" class="swatch-check"></Label>
          }
        </GridLayout>
      </GridLayout>
      }
    </WrapLayout>

    <GridLayout rows="auto" columns="*, auto" class="mt-4">
      <Label col="0" text="THICKNESS" class="tool-caption"></Label>
      <Label col="1" [text]="thickness() + ' pt'" class="tool-value"></Label>
    </GridLayout>
    <GridLayout rows="auto" columns="auto, *, auto" class="mt-1">
      <GridLayout col="0" width="28" height="28" verticalAlignment="center">
        <GridLayout width="4" height="4" borderRadius="2" [backgroundColor]="color()"></GridLayout>
      </GridLayout>
      <Slider col="1" minValue="1" maxValue="9" [value]="thickness()" (valueChange)="onThickness($any($event).value)"
        class="thickness-slider" [color]="color()"></Slider>
      <GridLayout col="2" width="28" height="28" verticalAlignment="center">
        <GridLayout width="16" height="16" borderRadius="8" [backgroundColor]="color()"></GridLayout>
      </GridLayout>
    </GridLayout>
    <!-- live stroke preview -->
    <GridLayout height="24" class="mt-1">
      <GridLayout [height]="thickness()" [borderRadius]="thickness() / 2" [backgroundColor]="color()" class="mx-8"
        verticalAlignment="center"></GridLayout>
    </GridLayout>
  </StackLayout>

  <GridLayout rows="auto" row="3" columns="*, *, 2*" class="bottom-bar">
    <Button col="0" text="Undo" class="btn-soft" (tap)="pad.undo()"></Button>
    <Button col="1" text="Clear" class="btn-soft" (tap)="pad.clear()"></Button>
    <Button col="2" text="Save signature" class="btn-primary" [isEnabled]="hasInk()" (tap)="save()"></Button>
  </GridLayout>
</GridLayout>
